name: Release - Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact MAJOR.MINOR.PATCH from the reviewed manifest
        required: true
        type: string

permissions:
  contents: write
  checks: read
  actions: read

concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish immutable RC
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14.8'
      - name: Publish once from an exact successful CI commit
        env:
          GH_TOKEN: ${{ github.token }}
          IM_VERSION: ${{ inputs.version }}
        run: python scripts/release.py publish
