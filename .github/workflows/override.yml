name: Release - Override

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact MAJOR.MINOR.PATCH
        required: true
        type: string
      domain:
        required: true
        type: string
      release_id:
        required: true
        type: string
      sha256:
        description: Exact immutable integration.zip SHA-256
        required: true
        type: string
      confirmation:
        description: THEFLDR authorizes promotion of v<version>
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-promotion-${{ inputs.release_id }}
  cancel-in-progress: false

jobs:
  override:
    name: Owner-authorized emergency promotion
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14.8'
      - name: Reject unauthorized or incomplete override before changes
        env:
          IM_VERSION: ${{ inputs.version }}
          IM_CONFIRMATION: ${{ inputs.confirmation }}
        run: python scripts/release.py authorize-override
      - name: Install locked JWT environment once
        run: python -m pip install --require-hashes -r requirements-release.lock
      - name: Validate security invariants and audit emergency promotion
        env:
          GH_TOKEN: ${{ github.token }}
          IM_APP_ID: ${{ vars.IM_APP_ID }}
          IM_CLIENT_ID: ${{ vars.IM_CLIENT_ID }}
          IM_INSTALLATION_ID: ${{ vars.IM_INSTALLATION_ID }}
          IM_APP_PRIVATE_KEY: ${{ secrets.IM_APP_PRIVATE_KEY }}
          IM_VERSION: ${{ inputs.version }}
          IM_DOMAIN: ${{ inputs.domain }}
          IM_RELEASE_ID: ${{ inputs.release_id }}
          IM_SHA256: ${{ inputs.sha256 }}
          IM_CONFIRMATION: ${{ inputs.confirmation }}
          IM_REGISTRY_REPOSITORY: THEFLDR/HomeAssistant-IntegrationManager
        run: python scripts/release.py override
